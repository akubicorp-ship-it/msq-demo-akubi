const donutN=(sg,c)=>{const r=52,C=2*Math.PI*r,t=sg.reduce((a,x)=>a+x[0],0)||1;let o=0;return `<svg viewBox="0 0 140 140" class="dn"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--cell)" stroke-width="18"/>${sg.map(x=>{const l=C*x[0]/t,d=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${x[1]}" stroke-width="18" stroke-dasharray="${Math.max(0,l-2)} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)"/>`;o+=l;return d}).join('')}<text x="70" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="currentColor">${c}</text><text x="70" y="90" text-anchor="middle" font-size="10" fill="var(--muted)">tagihan</text></svg>`};
const vbar=(v,lb)=>{const W=300,H=190,m=Math.max(...v,1)*1.2,bw=46,gp=(W-40-bw*v.length)/(v.length+1);return `<svg viewBox="0 0 ${W} ${H}" class="ch">${[0,1,2,3].map(i=>`<line x1="34" x2="${W-6}" y1="${14+i*(H-48)/3}" y2="${14+i*(H-48)/3}" stroke="var(--line)"/>`).join('')}${v.map((n,i)=>{const h=n/m*(H-48),x=40+gp*(i+1)+bw*i;return `<rect x="${x}" y="${H-34-h}" width="${bw}" height="${h}" rx="6" fill="var(--g)"/><text x="${x+bw/2}" y="${H-39-h}" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">${n}</text><text x="${x+bw/2}" y="${H-14}" text-anchor="middle" font-size="11" fill="var(--muted)">${lb[i]}</text>`}).join('')}</svg>`};
const area2=(A,B,lb)=>{const W=620,H=230,m=Math.max(...A,...B)*1.12,x=i=>46+i*(W-66)/(A.length-1),y=n=>H-30-n/m*(H-50),pt=a=>a.map((n,i)=>x(i)+','+y(n)).join(' '),ln=(a,c)=>`<polygon points="46,${H-30} ${pt(a)} ${W-20},${H-30}" fill="${c}" opacity=".13"/><polyline points="${pt(a)}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;
return `<svg viewBox="0 0 ${W} ${H}" class="ch">${[0,1,2,3,4].map(i=>{const yy=18+i*(H-48)/4;return `<line x1="46" x2="${W-20}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="40" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(m*(1-i/4))}</text>`}).join('')}${ln(A,'#3b4a52')}${ln(B,'#1d8998')}${B.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="3.5" fill="var(--card)" stroke="#1d8998" stroke-width="2"/>`).join('')}${lb.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`).join('')}</svg>`};
const donut=(p,l)=>{const r=52,c=2*Math.PI*r;return `<svg viewBox="0 0 140 140" class="dn"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--cell)" stroke-width="16"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--g)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 70 70)"/><text x="70" y="70" text-anchor="middle" font-size="26" font-weight="800" fill="currentColor">${p}%</text><text x="70" y="90" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text></svg>`};
const area=(v,lb)=>{const W=520,H=180,m=Math.max(...v)*1.15,x=i=>30+i*(W-50)/(v.length-1),y=n=>H-26-n/m*(H-44),pt=v.map((n,i)=>x(i)+','+y(n)).join(' ');return `<svg viewBox="0 0 ${W} ${H}" class="ch"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--g)" stop-opacity=".3"/><stop offset="1" stop-color="var(--g)" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="30" x2="${W-20}" y1="${18+i*(H-44)/3}" y2="${18+i*(H-44)/3}" stroke="var(--line)"/>`).join('')}<polygon points="30,${H-26} ${pt} ${W-20},${H-26}" fill="url(#ag)"/><polyline points="${pt}" fill="none" stroke="var(--g)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="4" fill="var(--card)" stroke="var(--g)" stroke-width="2"/><text x="${x(i)}" y="${y(n)-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${n}</text>`).join('')}${lb.map((l,i)=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`).join('')}</svg>`};
const row=(l,v,m,u='')=>`<div class="r"><span>${esc(l)}</span><div class="bar"><i style="width:${Math.min(100,v/m*100)}%"></i></div><b>${v}${u}</b></div>`;
const strip=j=>`<div class="strip">${Array.from({length:30},(_,i)=>{const f=Math.max(0,Math.min(1,j-i));return `<i class="${f>=1?'f':''}">${f>0&&f<1?`<b style="width:${f*100}%"></b>`:'<b></b>'}</i>`}).join('')}</div>`;
const more=(n,lim,k,c)=>n>lim?`<tr><td colspan="${c}" style="text-align:center;padding:14px"><small style="color:var(--muted)">Menampilkan ${lim} dari ${n}.</small> <button class="btn s o" data-a="more" data-k="${k}">Tampilkan ${Math.min(20,n-lim)} lagi</button></td></tr>`:'';
